{% extends "base.html" %}

{% block title %}Login - Under-12 Football Manager{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 100px auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">⚽ Football Manager</h2>
    
    {% if error %}
    <div style="background: #c41e3a; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        ❌ {{ error }}
    </div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autofocus>
        </div>
        
        <button type="submit" class="btn btn-success" style="width: 100%;">
            🔓 Login
        </button>
    </form>
</div>
{% endblock %}
