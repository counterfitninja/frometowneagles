<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e1f28">
    <title>{% block title %}Under-12 Football Manager{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icon-192.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #1e1f28;
            --panel: #252731;
            --panel-2: #2d3443;
            --paper: #efe5d8;
            --paper-2: #f7efe5;
            --line: #d2c5b6;
            --muted: #756d66;
            --red: #c41e3a;
            --red-dark: #8f172b;
            --gold: #d4af37;
            --gold-dark: #aa8622;
            --green: #39583c;
            --focus: #f1d16a;
        }

        body {
            font-family: "Aptos", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ink);
            color: var(--paper);
            min-height: 100vh;
            padding: 24px;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--paper);
            border: 1px solid var(--line);
            border-left: 8px solid var(--red);
            border-radius: 0;
            padding: 18px 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            color: var(--ink);
            margin-bottom: 12px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(22px, 2vw, 30px);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .menu-toggle {
            display: none;
            background: var(--ink);
            color: var(--paper);
            border: 1px solid var(--ink);
            padding: 10px 14px;
            border-radius: 0;
            cursor: pointer;
            font-size: 20px;
            font-weight: 600;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }

        .menu-toggle:hover {
            background: var(--red);
        }

        .btn {
            background: var(--panel);
            color: var(--paper);
            border: 1px solid var(--panel);
            padding: 10px 16px;
            border-radius: 0;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }

        .btn:hover {
            background: var(--red);
            border-color: var(--red);
        }

        .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .btn-danger {
            background: var(--red);
            border-color: var(--red);
        }

        .btn-danger:hover {
            background: var(--red-dark);
            border-color: var(--red-dark);
        }

        .btn-success {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--ink);
        }

        .btn-success:hover {
            background: var(--gold-dark);
            border-color: var(--gold-dark);
            color: var(--ink);
        }

        .card {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 0;
            padding: clamp(20px, 3vw, 34px);
            margin-bottom: 18px;
        }

        .card h2, .card h3 {
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            letter-spacing: -0.035em;
        }

        .card h2 {
            margin-bottom: 18px;
            font-size: clamp(26px, 3vw, 42px);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--ink);
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 0;
            font-size: 14px;
            background: var(--paper-2);
            color: var(--ink);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--red);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            background: var(--panel);
            color: var(--paper);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        tr:nth-child(even) td {
            background: rgba(45, 52, 67, 0.06);
        }

        .offline-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--red);
            color: var(--paper);
            padding: 10px 20px;
            border-radius: 0;
            display: none;
            font-weight: 600;
            border: 1px solid var(--paper);
        }

        .muted, .card p, .card li {
            color: var(--muted);
        }

        .offline-indicator.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-logo {
                width: 50px;
                height: 50px;
            }

            .header-content {
                width: 100%;
            }

            .menu-toggle {
                display: block;
                width: 100%;
                margin-bottom: 10px;
            }

            .nav {
                flex-direction: column;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-out;
            }

            .nav.active {
                max-height: 500px;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="/static/design-language.css?v=20260818-rounded">
</head>
<body>
    <div class="container">
        {% if session.logged_in %}
        <div class="header">
            <img src="/static/logo.jpg" alt="Team Logo" class="header-logo">
            <div class="header-content">
                <h1>⚽ {{ team_title }}</h1>
                <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
                <nav class="nav" id="mainNav">
                    <a href="/" class="btn">Home</a>
                    <a href="/players" class="btn">Players</a>
                    <a href="/team-generator" class="btn">Generator</a>
                    <a href="/gameday" class="btn btn-success">Game Day</a>
                    <a href="/live" class="btn btn-danger">Live</a>
                    <a href="/matches" class="btn">Matches</a>
                    <a href="/stats" class="btn">Leaderboard</a>
                    <a href="/settings" class="btn">Settings</a>
                    <a href="/logout" class="btn btn-danger">Logout</a>
                </nav>
            </div>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
        
        {% if version %}
        <div style="text-align: center; padding: 20px; color: #756d66; font-size: 12px;">
            v{{ version }}
        </div>
        {% endif %}
    </div>

    <div class="offline-indicator" id="offlineIndicator">
        📡 Offline Mode
    </div>

    <script>
        // Toggle mobile menu
        function toggleMenu() {
            const nav = document.getElementById('mainNav');
            nav.classList.toggle('active');
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }

        // Offline indicator
        window.addEventListener('online', () => {
            document.getElementById('offlineIndicator').classList.remove('show');
        });

        window.addEventListener('offline', () => {
            document.getElementById('offlineIndicator').classList.add('show');
        });

        if (!navigator.onLine) {
            document.getElementById('offlineIndicator').classList.add('show');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
