{% if players %}
<details class="card player-picker" open>
    <summary>When am I not playing?</summary>
    <p>Click your name to see your upcoming non-playing dates.</p>
    <div class="players-grid">
        {% for player in players %}
        <a class="player-chip" href="{{ url_for('public_player', player_id=player.id) }}">{{ player.name }}</a>
        {% endfor %}
    </div>
</details>
{% endif %}
