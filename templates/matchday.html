<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2035">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/design-language.css">
    <title>⚽ Match Day: {{ formation_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a2035;
            color: white;
        }

        body { padding-bottom: 30px; }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px;
            background: #242b3d;
            border-bottom: 1px solid #333d55;
        }

        .top-bar button, .top-bar a {
            background: #003d7a;
            color: white;
            border: none;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .top-bar .reset { background: #c41e3a; }

        .match-title {
            flex: 1;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
            min-width: 0;
        }

        .match-title small {
            display: block;
            font-size: 11px;
            color: #8899bb;
            font-weight: normal;
        }

        .offline-badge {
            display: none;
            background: #7a5800;
            color: #ffe08a;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            padding: 5px;
        }

        .offline-badge.show { display: block; }

        /* SCOREBOARD */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            padding: 16px 12px;
            background: #242b3d;
            border-bottom: 2px solid #333d55;
        }

        .score-side { text-align: center; }

        .score-team {
            font-size: 12px;
            color: #8899bb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .score-value {
            font-size: 46px;
            font-weight: 900;
            line-height: 1;
        }

        .score-sep { font-size: 28px; color: #556080; }

        .opp-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .opp-controls button {
            width: 42px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid #3a4562;
            background: #1a2035;
            color: #ccd0e0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MAIN GOAL BUTTON */
        .goal-btn {
            display: block;
            width: calc(100% - 24px);
            margin: 16px 12px;
            padding: 26px;
            border: none;
            border-radius: 16px;
            background: #d4af37;
            color: #1a2035;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            border-bottom: 4px solid #a8871f;
        }

        .goal-btn:active { transform: translateY(3px); border-bottom: 1px solid #a8871f; }

        /* EVENT LOG */
        .log-section { padding: 0 12px; }

        .log-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899bb;
            margin-bottom: 8px;
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #242b3d;
            border: 1px solid #333d55;
            border-radius: 10px;
            padding: 11px 12px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .log-item .text { flex: 1; line-height: 1.35; }
        .log-item .scorer { font-weight: 700; color: #d4af37; }
        .log-item .assist { color: #8899bb; font-size: 12px; display: block; }
        .log-item.opponent .scorer { color: #c41e3a; }

        .log-item .remove {
            background: none;
            border: 1px solid #3a4562;
            color: #8899bb;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .empty-log {
            color: #667088;
            font-size: 13px;
            font-style: italic;
            padding: 6px 0 12px;
        }

        .share-btn {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #25D366;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px;
        }

        .modal-overlay.hidden { display: none; }

        .modal {
            background: #242b3d;
            border: 1px solid #3a4562;
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 18px;
        }

        .modal h3 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 14px;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .player-btn {
            padding: 16px 10px;
            border-radius: 10px;
            border: 2px solid #333d55;
            background: #1a2035;
            color: #eceffa;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            min-height: 56px;
        }

        .player-btn:active { background: #003d7a; border-color: #4a6cf7; }

        .player-btn.wide { grid-column: 1 / -1; background: #2a3149; }

        .modal-cancel {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #3a4562;
            background: none;
            color: #ccd0e0;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/matches">←</a>
        <div class="match-title">
            vs {{ opponent }}
            <small>{{ match_date_display }}{% if location %} · {{ location }}{% endif %}</small>
        </div>
        <button class="reset" onclick="resetMatch()">Reset</button>
    </div>

    <div class="offline-badge" id="offlineBadge">📴 Offline — everything is saved on this device</div>

    <div class="scoreboard">
        <div class="score-side">
            <div class="score-team">Eagles</div>
            <div class="score-value" id="usScore">0</div>
        </div>
        <div class="score-sep">–</div>
        <div class="score-side">
            <div class="score-team">{{ opponent }}</div>
            <div class="score-value" id="themScore">0</div>
            <div class="opp-controls">
                <button onclick="changeOpponentScore(-1)">−</button>
                <button onclick="changeOpponentScore(1)">+</button>
            </div>
        </div>
    </div>

    <button class="goal-btn" onclick="openScorerModal()">⚽ GOAL!</button>

    <div class="log-section">
        <div class="log-title">Goals</div>
        <div id="log"></div>
        <button class="share-btn" onclick="shareSummary()">📱 Share Summary</button>
    </div>

    <div class="modal-overlay hidden" id="pickerModal">
        <div class="modal">
            <h3 id="pickerTitle">Who scored?</h3>
            <div class="player-grid" id="pickerGrid"></div>
            <button class="modal-cancel" onclick="closePicker()">Cancel</button>
        </div>
    </div>

<script>
    const FORMATION_ID = {{ formation_id }};
    const OPPONENT     = {{ opponent | tojson }};
    const SQUAD        = {{ squad_json | safe }};
    const STATE_KEY    = 'matchDay_' + FORMATION_ID;

    let state = loadState();
    let pendingScorer = null;

    function loadState() {
        try {
            const raw = localStorage.getItem(STATE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.goals)) return parsed;
            }
        } catch (e) {}
        return { goals: [], opponentGoals: 0 };
    }

    function saveState() {
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }

    function render() {
        document.getElementById('usScore').textContent = state.goals.length;
        document.getElementById('themScore').textContent = state.opponentGoals;

        const log = document.getElementById('log');
        log.innerHTML = '';

        if (!state.goals.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-log';
            empty.textContent = 'No goals yet. Tap GOAL! when we score.';
            log.appendChild(empty);
            return;
        }

        state.goals.forEach((goal, index) => {
            const item = document.createElement('div');
            item.className = 'log-item';

            const text = document.createElement('div');
            text.className = 'text';

            const scorer = document.createElement('span');
            scorer.className = 'scorer';
            scorer.textContent = (index + 1) + '. ⚽ ' + goal.scorer;
            text.appendChild(scorer);

            const assist = document.createElement('span');
            assist.className = 'assist';
            assist.textContent = goal.assist ? '👟 Assist: ' + goal.assist : 'No assist';
            text.appendChild(assist);

            const remove = document.createElement('button');
            remove.className = 'remove';
            remove.textContent = '✕';
            remove.onclick = () => removeGoal(index);

            item.appendChild(text);
            item.appendChild(remove);
            log.appendChild(item);
        });
    }

    function openScorerModal() {
        pendingScorer = null;
        showPicker('Who scored?', name => {
            pendingScorer = name;
            openAssistModal();
        });
    }

    function openAssistModal() {
        showPicker('Who assisted?', name => {
            state.goals.push({ scorer: pendingScorer, assist: name, at: Date.now() });
            saveState();
            closePicker();
            render();
        }, true);
    }

    function showPicker(title, onPick, withNoAssist) {
        document.getElementById('pickerTitle').textContent = title;
        const grid = document.getElementById('pickerGrid');
        grid.innerHTML = '';

        if (withNoAssist) {
            const none = document.createElement('button');
            none.className = 'player-btn wide';
            none.textContent = 'No assist';
            none.onclick = () => onPick(null);
            grid.appendChild(none);
        }

        SQUAD.forEach(player => {
            if (withNoAssist && player.name === pendingScorer) return;
            const btn = document.createElement('button');
            btn.className = 'player-btn';
            btn.textContent = player.name;
            btn.onclick = () => onPick(player.name);
            grid.appendChild(btn);
        });

        document.getElementById('pickerModal').classList.remove('hidden');
    }

    function closePicker() {
        document.getElementById('pickerModal').classList.add('hidden');
        pendingScorer = null;
    }

    function removeGoal(index) {
        if (!confirm('Remove this goal?')) return;
        state.goals.splice(index, 1);
        saveState();
        render();
    }

    function changeOpponentScore(delta) {
        state.opponentGoals = Math.max(0, state.opponentGoals + delta);
        saveState();
        render();
    }

    function resetMatch() {
        if (!confirm('Clear the score and all goals for this match?')) return;
        state = { goals: [], opponentGoals: 0 };
        saveState();
        render();
    }

    function buildSummary() {
        let text = '⚽ Eagles ' + state.goals.length + ' - ' + state.opponentGoals + ' ' + OPPONENT + '\n';
        state.goals.forEach((goal, index) => {
            text += '\n' + (index + 1) + '. ' + goal.scorer;
            if (goal.assist) text += ' (assist: ' + goal.assist + ')';
        });
        return text;
    }

    async function shareSummary() {
        const text = buildSummary();
        try {
            if (navigator.share) {
                await navigator.share({ text: text });
            } else {
                await navigator.clipboard.writeText(text);
                alert('Summary copied to clipboard');
            }
        } catch (e) {
            if (e.name !== 'AbortError') alert(text);
        }
    }

    function updateOfflineBadge() {
        document.getElementById('offlineBadge').classList.toggle('show', !navigator.onLine);
    }

    window.addEventListener('online', updateOfflineBadge);
    window.addEventListener('offline', updateOfflineBadge);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }

    updateOfflineBadge();
    render();
</script>
</body>
</html>
